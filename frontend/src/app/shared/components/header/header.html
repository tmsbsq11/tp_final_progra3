<header>
  <h1>OficiosYa</h1>
  <nav>
    <ul>
        <li><a href="">Inicio</a></li>
        
        @if(!authService.estaAutenticado()){
        <li><a routerLink="/login" routerLinkActive="active">Login</a></li>
        <li><a routerLink="/register" routerLinkActive="active">Registrarse</a></li>
        }@else{
          
          <li><a [routerLink]="perfilRoute">Perfil</a></li>
          <li><a (click)="authService.logout()">Cerrar Sesion</a></li>
        }
    </ul>
  </nav>
</header>
