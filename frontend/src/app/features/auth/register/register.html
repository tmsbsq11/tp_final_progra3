<h1>Registro</h1>
<form [formGroup]="formulario" (ngSubmit)="registrar()">
    <label for="correo">Correo</label>
    <input id="correo" type="email" formControlName="correo" placeholder="Ingrese su email">
    <label for="password">Contraseña</label>
    <input id="password" type="password" formControlName="password" placeholder="Ingrese su contraseña">
    <button type="submit" [disabled]="formulario.invalid || enviando()">
        {{ enviando() ? 'Registrando…' : 'Registrarse' }}
    </button>
</form>
